[package]
name = "secret-ink"
version = "0.1.0"
edition = "2024"
build = "build.rs"


[dependencies]
fastrand = "2.3"
ab_glyph = "0.2"
image = "0.25"
imageproc = "0.27"
pulldown-cmark = "0.13"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
textwrap = { version = "0.16", features = ["hyphenation"] }
ultraviolet = "0.10"
slint = "1.18.1"
rfd = "0.17.2"

[build-dependencies]
slint-build = "1.18.1"
